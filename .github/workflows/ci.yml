name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11','3.12','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt pytest
      - run: PYTHONPATH=. python -m compileall -q radar
      - run: node --check static/wiring.js
      - run: bash -n bin/install-termux.sh bin/start.sh bin/termux-health.sh bin/backup.sh
      - run: PYTHONPATH=. pytest -q
      - run: PYTHONPATH=. python -m radar.cli --help
