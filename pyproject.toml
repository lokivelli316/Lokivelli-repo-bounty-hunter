[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lokivelli-radar"
version = "0.1.0"
description = "Lokivelli Termux GitHub Radar + Auto-Manual Forge"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31,<3",
  "beautifulsoup4>=4.12,<5",
]

[project.scripts]
lokivelli-radar = "radar.cli:main"

[tool.setuptools]
packages = ["radar"]
